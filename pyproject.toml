[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-mlops-platform"
version = "0.1.0"
description = "End-to-end MLOps platform: MLflow training, drift-triggered retraining, FastAPI serving, Airflow orchestration, Terraform on AWS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kovarthanam Muthusamy" }]

[project.optional-dependencies]
evidently = ["evidently>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
